<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#152f3a">
  <meta name="description" content="Red de veeduría ciudadana P2P: registro y seguimiento transparente de quejas del conjunto residencial">
  <title>Veeduría del conjunto</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/iconos/icono-192.png" type="image/png">
  <link rel="apple-touch-icon" href="/iconos/icono-192.png">
  <link rel="preload" href="/fuentes/archivo-latin-wdth-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/fuentes/atkinson-hyperlegible-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/css/estilos.css">
</head>
<body>
  <a class="saltar-contenido" href="#vista">Saltar al contenido</a>
  <header class="barra" id="barra" hidden>
    <div class="barra-marca">
      <img src="/iconos/comunidad.png" alt="" width="36" height="36">
      <div>
        <strong>Veeduría del conjunto</strong>
      </div>
    </div>
    <div class="barra-acciones">
      <span class="chip-red" id="chip-red" title="Estado de la conexión">en línea</span>
      <button class="boton-icono" id="boton-sync" title="Sincronizar ahora" aria-label="Sincronizar ahora"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11a8 8 0 00-14.3-4.9L4 8M4 3v5h5M4 13a8 8 0 0014.3 4.9L20 16M20 21v-5h-5"/></svg></button>
      <button class="boton-icono" id="boton-salir" title="Cerrar sesión" aria-label="Cerrar sesión"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4h4a2 2 0 012 2v12a2 2 0 01-2 2h-4M10 16l-4-4 4-4M6 12h10"/></svg></button>
    </div>
  </header>


  <nav aria-label="Navegación principal" class="menu" id="menu" hidden></nav>

  <main tabindex="-1" id="vista" class="vista"></main>

  <div id="aviso" class="aviso" role="status" aria-live="polite"></div>

  <dialog id="visor" class="visor">
    <img id="visor-img" alt="Fotografía de la queja">
    <form method="dialog"><button class="boton">Cerrar</button></form>
  </dialog>

  <script type="module" src="/js/app.js"></script>
</body>
</html>
